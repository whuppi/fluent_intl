name: fluent_intl
version: 0.1.0
description: >-
  package:intl formatting backend for fluent_bundle — per-language plural
  rules and locale-aware number, currency, and date formatting. Zero
  setup, pure Dart. For Project Fluent.
homepage: https://github.com/whuppi/fluent_intl
repository: https://github.com/whuppi/fluent_intl
issue_tracker: https://github.com/whuppi/fluent_intl/issues

topics:
  - i18n
  - localization
  - fluent
  - intl

environment:
  sdk: ^3.7.0

# Path dependency on fluent_bundle while these packages are unpublished — the
# release checklist flips it to a hosted version at publish time.
dependencies:
  # The package this is a backend FOR — re-exported from its main library.
  fluent_bundle: ^0.1.0
  # intl's version is kept fresh against flutter_localizations' per-Flutter
  # pin — THE reason this backend is a separate package, so fluent_bundle never waits.
  intl: ">=0.19.0 <0.21.0"

  # Spelled-out currency names for `currencyDisplay: "name"` (intl has none).
  l10n_currencies: ^2.0.2

dev_dependencies:
  # Lint rules
  lints: ^5.0.0

  # Test runner
  test: ^1.25.0
  yaml: ^3.1.0
